<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Компас отношений / Relationship Compass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F1E7;
    --paper-2:#EFE6D6;
    --ink:#2B2724;
    --ink-soft:#5B534B;
    --rose:#AD5D68;
    --rose-deep:#8C4650;
    --sage:#5F7864;
    --gold:#B8934A;
    --line:#D8CBB2;
    --off:#8A8378;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'PT Sans', sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'PT Serif', serif;}
  .wrap{max-width:780px;margin:0 auto;padding:28px 20px 90px;}

  /* header */
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:12px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand svg{flex-shrink:0;}
  .brand-text .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose-deep);font-weight:700;}
  .brand-text h1{font-size:22px;margin:2px 0 0;font-weight:700;}
  .lang-toggle{display:flex;border:1.5px solid var(--ink);border-radius:20px;overflow:hidden;flex-shrink:0;}
  .lang-toggle button{
    border:none;background:transparent;padding:7px 16px;font-family:'PT Sans';font-size:13px;font-weight:700;
    cursor:pointer;color:var(--ink); letter-spacing:.03em;
  }
  .lang-toggle button.active{background:var(--ink);color:var(--paper);}

  /* intro */
  .intro{margin-bottom:8px;}
  .intro p{color:var(--ink-soft);font-size:15px;}
  .intro .lede{font-size:17px;font-family:'PT Serif';font-style:italic;color:var(--ink);margin-bottom:14px;}
  details.why{margin:14px 0 24px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-2);padding:2px 16px;}
  details.why summary{cursor:pointer;font-weight:700;padding:12px 0;color:var(--rose-deep);list-style:none;}
  details.why summary::-webkit-details-marker{display:none;}
  details.why summary:before{content:"◆ ";font-size:10px;}
  details.why p{font-size:14px;color:var(--ink-soft);margin:0 0 14px;}
  details.why ul{font-size:14px;color:var(--ink-soft);padding-left:18px;margin:0 0 14px;}

  /* mode selector */
  .mode-select{display:flex;gap:10px;margin:20px 0 8px;}
  .mode-card{
    flex:1;border:1.5px solid var(--ink);border-radius:var(--radius);padding:14px 16px;cursor:pointer;
    background:var(--paper);transition:all .15s ease;
  }
  .mode-card.active{background:var(--ink);color:var(--paper);}
  .mode-card .m-title{font-family:'PT Serif';font-weight:700;font-size:16px;}
  .mode-card .m-sub{font-size:12.5px;opacity:.75;margin-top:3px;}

  .download-row{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 18px;
    border:1.5px dashed var(--rose-deep);border-radius:var(--radius);padding:14px 16px;background:var(--paper-2);
  }
  .download-row .btn{flex-shrink:0;}
  .download-row .dl-hint{font-size:12.5px;color:var(--ink-soft);}

  .date-row{display:flex;align-items:center;gap:10px;margin:18px 0 26px;font-size:14px;color:var(--ink-soft);}
  .date-row input[type=date]{
    font-family:'PT Sans';border:none;border-bottom:1.5px solid var(--ink);background:transparent;
    padding:4px 2px;font-size:14px;color:var(--ink);
  }

  /* section card */
  .section{margin-bottom:30px;}
  .section-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
  .section-head .num{font-family:'PT Serif';font-style:italic;color:var(--gold);font-size:14px;}
  .section-head h2{font-size:19px;margin:0;}
  .section-sub{font-size:13.5px;color:var(--ink-soft);margin:2px 0 14px;}

  /* compass radar */
  .compass-wrap{display:flex;justify-content:center;margin:6px 0 10px;}
  .compass-legend{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 18px;font-size:11.5px;color:var(--ink-soft);margin-bottom:18px;}
  .compass-legend span{display:flex;align-items:center;gap:5px;}
  .compass-legend .dotc{width:9px;height:9px;border-radius:2px;display:inline-block;}

  /* rating legend for menu */
  .rate-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:18px;background:var(--paper-2);}
  .rate-legend .li{display:flex;align-items:center;gap:6px;}  .rate-legend .ic{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;flex-shrink:0;}
  .ic.st-must{background:var(--rose-deep);color:#fff;}
  .ic.st-like{background:#fff;border:2px solid var(--rose-deep);color:var(--rose-deep);}
  .ic.st-maybe{background:#fff;border:2px dashed var(--gold);color:var(--gold);}
  .ic.st-off{background:#fff;border:2px solid var(--off);color:var(--off);}

  .tip-box{
    border:1px solid var(--line);background:var(--paper-2);border-radius:10px;
    padding:12px 16px;font-size:13px;color:var(--ink-soft);margin-bottom:22px;
  }
  .tip-box b{color:var(--ink);}

  /* components menu */
  .category{border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;background:#FFFDF8;}
  .category h3{font-size:15.5px;margin:0 0 2px;display:flex;align-items:center;gap:8px;}
  .category .cat-desc{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
  .cat-score{font-size:11px;color:var(--ink-soft);margin-bottom:10px;font-style:italic;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
  .chip{
    border:1.5px solid var(--line);border-radius:999px;padding:5px 12px 5px 8px;font-size:12.5px;cursor:pointer;
    background:#fff;color:var(--ink-soft);transition:all .12s;user-select:none;display:inline-flex;align-items:center;gap:6px;
  }
  .chip .ic{width:15px;height:15px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:700;border:1.5px solid var(--line);flex-shrink:0;background:#fff;}
  .chip.st-must{border-color:var(--rose-deep);color:var(--ink);font-weight:700;}
  .chip.st-must .ic{background:var(--rose-deep);border-color:var(--rose-deep);color:#fff;}
  .chip.st-like{border-color:var(--rose-deep);color:var(--ink);}
  .chip.st-like .ic{border-color:var(--rose-deep);color:var(--rose-deep);}
  .chip.st-maybe{border-color:var(--gold);color:var(--ink);}
  .chip.st-maybe .ic{border:2px dashed var(--gold);color:var(--gold);}
  .chip.st-off{border-color:var(--off);color:var(--off);text-decoration:line-through;opacity:.7;}
  .chip.st-off .ic{border-color:var(--off);color:var(--off);}
  .add-row{display:flex;gap:6px;}
  .add-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;font-family:'PT Sans';background:#fff;}
  .add-row button{border:1px solid var(--ink);background:transparent;border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;}
  textarea.note{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:'PT Sans';
    font-size:13px;margin-top:4px;background:#fff;resize:vertical;min-height:44px;
  }

  /* freeform questions */
  .qa{margin-bottom:18px;}
  .qa label{display:block;font-family:'PT Serif';font-style:italic;font-size:14.5px;margin-bottom:6px;color:var(--ink);}
  .qa textarea, .qa input[type=text]{
    width:100%;border:none;border-bottom:1.5px solid var(--line);background:transparent;
    font-family:'PT Sans';font-size:14px;padding:6px 2px;resize:vertical;min-height:38px;color:var(--ink);
  }
  .qa textarea:focus,.qa input:focus{outline:none;border-bottom-color:var(--rose);}
  .triplet{display:grid;grid-template-columns:1fr;gap:8px;}
  .triplet input{border:none;border-bottom:1px solid var(--line);background:transparent;font-size:13.5px;padding:5px 2px;font-family:'PT Sans';}

  /* actions */
  .actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;}
  .btn{
    border-radius:24px;padding:12px 22px;font-family:'PT Sans';font-weight:700;font-size:14px;cursor:pointer;
    border:1.5px solid var(--ink);
  }
  .btn.primary{background:var(--ink);color:var(--paper);}
  .btn.ghost{background:transparent;color:var(--ink);}
  .save-msg{font-size:13px;color:var(--sage);font-weight:700;align-self:center;opacity:0;transition:opacity .3s;}
  .save-msg.show{opacity:1;}

  /* history */
  .history-list{border-top:1px solid var(--line);}
  .hist-item{
    display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);
    font-size:13.5px;cursor:pointer;
  }
  .hist-item:hover{background:var(--paper-2);}
  .hist-item .htype{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--rose-deep);font-weight:700;}
  .hist-item .hdel{color:#a55;font-size:12px;cursor:pointer;}
  .empty-note{font-size:13.5px;color:var(--ink-soft);font-style:italic;padding:14px 4px;}

  .sub-block{margin-top:26px;padding-top:18px;border-top:1px dashed var(--line);}
  .sub-block h3{font-size:15px;margin:0 0 4px;color:var(--rose-deep);font-family:'PT Serif';}
  .sub-block .sub-desc{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}

  .growth-row, .life-row{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff;}
  .life-row h4{margin:0 0 8px;font-size:13.5px;color:var(--rose-deep);font-family:'PT Serif';}
  .field-label{font-size:10.5px;color:var(--ink-soft);display:block;margin:0 0 3px;text-transform:uppercase;letter-spacing:.04em;}
  .field-block{margin-bottom:8px;}
  .field-block:last-child{margin-bottom:0;}
  .growth-row textarea, .life-row textarea{
    width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;
    font-family:'PT Sans';resize:vertical;min-height:32px;background:var(--paper-2);
  }
  .row-actions{display:flex;justify-content:flex-end;margin-top:6px;}
  .row-actions button{background:none;border:none;color:#a55;font-size:12px;cursor:pointer;padding:2px 4px;}
  .add-row-btn{
    border:1px dashed var(--ink);background:transparent;border-radius:8px;padding:8px 14px;
    font-size:12.5px;cursor:pointer;font-family:'PT Sans';color:var(--ink-soft);
  }

  footer{margin-top:40px;text-align:center;font-size:12px;color:var(--ink-soft);}

  @media print{
    body{background:#fff;}
    .lang-toggle,.mode-select,.download-row,.actions,.history-section,details.why{display:none !important;}
    .chip{border:1px solid #999;}
    .btn{display:none !important;}
  }
  @media (max-width:480px){
    .mode-select{flex-direction:column;}
    .brand-text h1{font-size:19px;}
    .rate-legend{gap:10px;}
  }
</style>

/* ---------------------------------------------------------------
   Storage layer: uses Claude's artifact window.storage when running
   inside a Claude.ai artifact, and transparently falls back to the
   browser's own localStorage when deployed as a standalone page.
   localStorage never leaves the visitor's own browser — nothing is
   ever sent to any server, so no one else's data is ever collected.
--------------------------------------------------------------- */
const LocalStore = {
  async get(key){
    try{
      const v = localStorage.getItem(key);
      return v !== null ? {key, value: v} : null;
    }catch(e){ return null; }
  },
  async set(key, value){
    try{ localStorage.setItem(key, value); return {key, value}; }
    catch(e){ return null; }
  },
  async delete(key){
    try{ localStorage.removeItem(key); return {key, deleted:true}; }
    catch(e){ return null; }
  },
  async list(prefix){
    try{
      const keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(!prefix || (k && k.indexOf(prefix)===0)) keys.push(k);
      }
      return {keys, prefix};
    }catch(e){ return null; }
  }
};
const storage = (typeof window !== "undefined" && window.storage) ? window.storage : LocalStore;

const STATE_SYMBOL = ["", "\u25CF", "\u25CB", "?", "\u2298"];
const STATE_SCORE   = [null, 5, 3.5, 2, 0];

/* ---------------------------------------------------------------
   State
--------------------------------------------------------------- */
let state = {
  lang: "ru",
  mode: "weekly",
  date: new Date().toISOString().slice(0,10),
  checked: {},          // catId -> { itemKey: stateIndex(0-4) }
  customComponents: {}, // catId -> [labels]
  notes: {},            // catId -> text
  answers: {},          // question key -> text
  growthRows: [{issue:"",causes:"",help:"",next:""}], // conflict/growth table rows
  achievementRows: [{moment:"",emotions:"",why:"",keep:""}], // achievements table rows
  lifeGoals: {},        // areaId -> {goal, support}
  bucket: "",           // free bucket-list text

};
CAT_ORDER.forEach(c=>{ state.checked[c]={}; state.customComponents[c]=[]; state.notes[c]=""; });

function tr(){ return T[state.lang]; }

/* ---------------------------------------------------------------
   Storage helpers
--------------------------------------------------------------- */
async function loadHistory(){
  try{
    const list = await storage.list("entry:");
    if(!list || !list.keys) { state.history=[]; return; }
    const entries = [];
    for(const k of list.keys){
      try{
        const r = await storage.get(k);
        if(r && r.value) entries.push(JSON.parse(r.value));
      }catch(e){}
    }
    entries.sort((a,b)=> b.date.localeCompare(a.date) || b.savedAt - a.savedAt);
    state.history = entries;
  }catch(e){ state.history = []; }
}

async function saveEntry(){
  const id = "entry:" + state.date + "-" + state.mode + "-" + Date.now();
  const payload = {
    id, mode: state.mode, date: state.date, savedAt: Date.now(),
    checked: JSON.parse(JSON.stringify(state.checked)),
    customComponents: JSON.parse(JSON.stringify(state.customComponents)),
    notes: JSON.parse(JSON.stringify(state.notes)),
    answers: JSON.parse(JSON.stringify(state.answers)),
    growthRows: JSON.parse(JSON.stringify(state.growthRows)),
    achievementRows: JSON.parse(JSON.stringify(state.achievementRows)),
    lifeGoals: JSON.parse(JSON.stringify(state.lifeGoals)),
    bucket: state.bucket
  };
  try{
    await storage.set(id, JSON.stringify(payload));
    await loadHistory();
    render();
    const msg = document.getElementById("saveMsg");
    if(msg){ msg.classList.add("show"); setTimeout(()=>msg.classList.remove("show"), 2200); }
  }catch(e){ console.error("storage error", e); }
}

async function deleteEntry(id){
  try{
    await storage.delete(id);
    await loadHistory();
    render();
  }catch(e){ console.error(e); }
}

function loadEntryIntoForm(entry){
  state.mode = entry.mode;
  state.date = entry.date;
  state.checked = JSON.parse(JSON.stringify(entry.checked));
  state.customComponents = JSON.parse(JSON.stringify(entry.customComponents));
  state.notes = JSON.parse(JSON.stringify(entry.notes));
  state.answers = JSON.parse(JSON.stringify(entry.answers));
  state.growthRows = entry.growthRows ? JSON.parse(JSON.stringify(entry.growthRows)) : [{issue:"",causes:"",help:"",next:""}];
  state.achievementRows = entry.achievementRows ? JSON.parse(JSON.stringify(entry.achievementRows)) : [{moment:"",emotions:"",why:"",keep:""}];
  state.lifeGoals = entry.lifeGoals ? JSON.parse(JSON.stringify(entry.lifeGoals)) : {};
  state.bucket = entry.bucket || "";
  CAT_ORDER.forEach(c=>{
    if(!state.checked[c]) state.checked[c]={};
    if(!state.customComponents[c]) state.customComponents[c]=[];
    if(state.notes[c]===undefined) state.notes[c]="";
  });
  LIFE_AREAS.forEach(a=>{
    if(!state.lifeGoals[a]) state.lifeGoals[a] = {goal:"", support:""};
  });
  if(state.growthRows.length===0) state.growthRows=[{issue:"",causes:"",help:"",next:""}];
  if(state.achievementRows.length===0) state.achievementRows=[{moment:"",emotions:"",why:"",keep:""}];
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

--------------------------------------------------------------- */
function computeCategoryScore(checkedObj, catId){
  const items = (checkedObj && checkedObj[catId]) ? checkedObj[catId] : {};
  let sum = 0, n = 0;
  for(const k in items){
    const st = items[k];
    const sc = STATE_SCORE[st];
    if(sc !== null && sc !== undefined){ sum += sc; n++; }
  }
  return n>0 ? sum/n : 0;
}
function computeAllScores(checkedObj){
  const out = {};
  CAT_ORDER.forEach(c=> out[c] = computeCategoryScore(checkedObj, c));
  return out;
}

/* ---------------------------------------------------------------
   Radar / compass SVG
--------------------------------------------------------------- */
function radarSVG(scores, size=300, compareScores=null){
  const n = CAT_ORDER.length;
  const cx=size/2, cy=size/2, R=size*0.34;
  const angle = i => (Math.PI*2*i/n) - Math.PI/2;
  const pt = (i, val) => {
    const r = R * (val/5);
    const a = angle(i);
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  };
  let rings = "";
  for(let ring=1; ring<=5; ring++){
    let pts=[];
    for(let i=0;i<n;i++){ pts.push(pt(i, ring).join(",")); }
    rings += `<polygon points="${pts.join(" ")}" fill="none" stroke="#D8CBB2" stroke-width="1"/>`;
  }
  let spokes = "";
  let labels = "";
  for(let i=0;i<n;i++){
    spokes += `<line x1="${cx}" y1="${cy}" x2="${pt(i,5)[0]}" y2="${pt(i,5)[1]}" stroke="#D8CBB2" stroke-width="1"/>`;
    const lp = pt(i,5);
    labels += `<circle cx="${lp[0]}" cy="${lp[1]}" r="4" fill="${CAT_COLOR[CAT_ORDER[i]]}"/>`;
  }
  function shape(vals, color, opacity, dash){
    let pts=[];
    for(let i=0;i<n;i++){ pts.push(pt(i, vals[CAT_ORDER[i]]||0).join(",")); }
    return `<polygon points="${pts.join(" ")}" fill="${color}" fill-opacity="${opacity}" stroke="${color}" stroke-width="2" ${dash?'stroke-dasharray="4 4"':''}/>`;
  }
  let compareShape = compareScores ? shape(compareScores, "#8C4650", 0.05, true) : "";
  let mainShape = shape(scores, "#AD5D68", 0.16, false);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${rings}${spokes}${compareShape}${mainShape}${labels}
  </svg>`;
}

/* ---------------------------------------------------------------
   Render
--------------------------------------------------------------- */
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function itemChip(catId, key, label){
  const st = state.checked[catId][key] || 0;
  const cls = STATE_CLASS[st];
  const sym = STATE_SYMBOL[st];
  return `<span class="chip st-${cls}" onclick="cycleItem('${catId}','${esc(key)}')"><span class="ic">${sym}</span>${esc(label)}</span>`;
}

function categoryBlock(catId){
  const t = tr();
  const defaultComps = t.catComponents[catId];
  const customComps = state.customComponents[catId];
  const allComps = defaultComps.map((label,i)=>({key:"d"+i, label})).concat(customComps.map((label,i)=>({key:"c"+i, label})));
  const chips = allComps.map(c=> itemChip(catId, c.key, c.label)).join("");
  const score = computeCategoryScore(state.checked, catId);
  const scoreLabel = state.lang==="ru" ? `Текущий вес области: ${score.toFixed(1)} из 5` : `Current weight: ${score.toFixed(1)} of 5`;
  return `
  <div class="category">
    <h3 style="color:${CAT_COLOR[catId]}">${t.catNames[catId]}</h3>
    <div class="cat-desc">${t.catDesc[catId]}</div>
    <div class="cat-score">${scoreLabel}</div>
    <div class="chips">${chips}</div>
    <div class="add-row">
      <input type="text" placeholder="${t.addPlaceholder}" id="add-${catId}" onkeydown="if(event.key==='Enter'){addCustom('${catId}')}">
      <button onclick="addCustom('${catId}')">${t.addBtn}</button>
    </div>
    <textarea class="note" placeholder="${t.notePlaceholder}" oninput="updateNote('${catId}', this.value)">${esc(state.notes[catId])}</textarea>
  </div>`;
}

function qa(key, label, multiline=true){
  const val = esc(state.answers[key] || "");
  return `<div class="qa"><label>${label}</label>
    ${multiline ? `<textarea oninput="updateAnswer('${key}', this.value)">${val}</textarea>`
                : `<input type="text" value="${val}" oninput="updateAnswer('${key}', this.value)">`}
  </div>`;
}

function tripletInput(key, placeholder){
  const val = esc(state.answers[key] || "");
  return `<input type="text" placeholder="${placeholder}" value="${val}" oninput="updateAnswer('${key}', this.value)">`;
}

function weeklyBlock(){
  const t = tr();
  let out = `<div class="tip-box">${t.weeklyTips}</div>`;
  WEEKLY_SECTIONS.forEach(s=>{
    const head = t.weeklySectionHeads[s];
    const qs = t.weeklyQuestions[s];
    out += `<div class="sub-block"><h3>${head}</h3>`;
    qs.forEach((q, qi)=>{
      const key = `w_${s}_${qi}`;
      const multiline = !(s==="temp" && qi===0);
      out += qa(key, q, multiline);
    });
    out += `</div>`;
  });
  return out;
}

function achievementsBlock(){
  const t = tr();
  const cols = t.achieveCols;
  const fields = ["moment","emotions","why","keep"];
  const rows = state.achievementRows.map((row, idx)=>{
    const fieldsHtml = fields.map((f,i)=>`
      <div class="field-block">
        <label class="field-label">${cols[i]}</label>
        <textarea oninput="updateAchieveField(${idx}, '${f}', this.value)">${esc(row[f])}</textarea>
      </div>`).join("");
    const canRemove = state.achievementRows.length > 1;
    return `<div class="growth-row">${fieldsHtml}
      ${canRemove ? `<div class="row-actions"><button onclick="removeAchieveRow(${idx})">${t.removeRow} ✕</button></div>` : ""}
    </div>`;
  }).join("");
  return `
  <div class="sub-block">
    <h3>${t.achieveHead}</h3>
    <div class="sub-desc">${t.achieveSub}</div>
    ${rows}
    <button class="add-row-btn" onclick="addAchieveRow()">${t.addAchieveRow}</button>

}

function growthBlock(){

    const canRemove = state.growthRows.length > 1;

  return `

function boundariesBlock(){
  const t = tr();
  return `
  <div class="sub-block">
    <h3>${t.boundariesHead}</h3>
    <div class="sub-desc">${t.boundariesSub}</div>
    ${qa("boundQ1", t.boundQ1)}
    ${qa("boundQ2", t.boundQ2)}
    ${qa("boundQ3", t.boundQ3)}
    ${qa("boundQ4", t.boundQ4)}
  </div>`;
}

function lifeGoalsBlock(){
  const t = tr();
  const rows = LIFE_AREAS.map(a=>{
    const g = state.lifeGoals[a] || {goal:"",support:""};
    return `<div class="life-row">
      <h4>${t.lifeAreas[a]}</h4>
      <div class="field-block">
        <textarea placeholder="${t.lifeGoalPlaceholder}" oninput="updateLifeGoal('${a}','goal', this.value)">${esc(g.goal)}</textarea>
      </div>
      <div class="field-block">
        <textarea placeholder="${t.lifeSupportPlaceholder}" oninput="updateLifeGoal('${a}','support', this.value)">${esc(g.support)}</textarea>
      </div>
    </div>`;
  }).join("");
  return `

    ${rows}

function bucketBlock(){
  const t = tr();
  return `
  <div class="sub-block">
    <h3>${t.bucketHead}</h3>
    <div class="sub-desc">${t.bucketSub}</div>
    <textarea class="note" style="min-height:90px;" placeholder="${t.bucketPlaceholder}" oninput="updateBucket(this.value)">${esc(state.bucket)}</textarea>
  </div>`;
}

function render(){
  const t = tr();
  const app = document.getElementById("app");
  const isAnnual = state.mode === "annual";
  const isWeekly = state.mode === "weekly";
  let secIdx = 0;
  const ROMAN = ["I","II","III","IV","V","VI","VII"];
  function nextNum(){ return ROMAN[secIdx++] || String(secIdx); }

  let history = "";
  if(state.history.length === 0){
    history = `<div class="empty-note">${t.emptyHistory}</div>`;
  } else {
    history = `<div class="history-list">` + state.history.map(e=>{
      const label = e.mode==="annual" ? (state.lang==="ru"?"Год":"Year") : e.mode==="weekly" ? (state.lang==="ru"?"Неделя":"Week") : (state.lang==="ru"?"Квартал":"Quarter");
      return `<div class="hist-item">
        <span onclick='openHistory(${JSON.stringify(e.id)})' style="flex:1;cursor:pointer;">
          <span class="htype">${label}</span> — ${e.date}
        </span>
        <span class="hdel" onclick="if(confirm('${t.delConfirm}')){deleteEntryUI('${e.id}')}">✕</span>
      </div>`;
    }).join("") + `</div>`;
  }

  const compareEntry = state.history.length>0 ? state.history[0] : null;
  const compareScores = compareEntry ? computeAllScores(compareEntry.checked) : null;
  const currentScores = computeAllScores(state.checked);

  const legendChips = CAT_ORDER.map(c=>`<span><span class="dotc" style="background:${CAT_COLOR[c]}"></span>${t.catNames[c]}</span>`).join("");

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <svg width="40" height="40" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="17" fill="none" stroke="#2B2724" stroke-width="1.5"/>
          <circle cx="20" cy="20" r="2.5" fill="#AD5D68"/>
          <line x1="20" y1="6" x2="20" y2="15" stroke="#AD5D68" stroke-width="2" stroke-linecap="round"/>
          <line x1="20" y1="25" x2="20" y2="34" stroke="#5F7864" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <div class="brand-text">
          <div class="eyebrow">${t.eyebrow}</div>
          <h1>${t.title}</h1>
        </div>
      </div>
      <div class="lang-toggle">
        <button class="${state.lang==='ru'?'active':''}" onclick="setLang('ru')">RU</button>
        <button class="${state.lang==='en'?'active':''}" onclick="setLang('en')">EN</button>
      </div>
    </div>

    <div class="intro">
      <p class="lede">${t.lede}</p>
      <p>${t.introP1}</p>
      <details class="why">
        <summary>${t.whySummary}</summary>
        <p>${t.whyP1}</p>
        <p>${t.whyP2}</p>
        <ul>${t.whyList.map(li=>`<li>${li}</li>`).join("")}</ul>
      </details>
    </div>

    <div class="mode-select">
      <div class="mode-card ${isWeekly?'active':''}" onclick="setMode('weekly')">
        <div class="m-title">${t.weeklyTitle}</div>
        <div class="m-sub">${t.weeklySub}</div>
      </div>
      <div class="mode-card ${(!isWeekly && !isAnnual)?'active':''}" onclick="setMode('quarterly')">
        <div class="m-title">${t.quarterlyTitle}</div>
        <div class="m-sub">${t.quarterlySub}</div>
      </div>
      <div class="mode-card ${isAnnual?'active':''}" onclick="setMode('annual')">
        <div class="m-title">${t.annualTitle}</div>
        <div class="m-sub">${t.annualSub}</div>
      </div>
    </div>

    <div class="download-row">
      <button class="btn primary" onclick="window.print()">${t.downloadFillBtn}</button>
      <span class="dl-hint">${t.downloadFillHintPre}${isWeekly?t.weeklyTitle:(isAnnual?t.annualTitle:t.quarterlyTitle)}${t.downloadFillHintPost}</span>
    </div>

    <div class="date-row">
      <span>${t.dateLabel}</span>
      <input type="date" value="${state.date}" onchange="updateDate(this.value)">
    </div>

    ${!isWeekly ? `
    <div class="section">
      <div class="section-head"><span class="num">${nextNum()}</span><h2>${t.compassHead}</h2></div>
      <div class="section-sub">${t.compassSub}</div>
      <div class="compass-wrap">${radarSVG(currentScores, 300, compareScores)}</div>
      <div class="compass-legend">${legendChips}</div>
    </div>

    <div class="section">
      <div class="section-head"><span class="num">${nextNum()}</span><h2>${t.menuHead}</h2></div>
      <div class="section-sub">${t.menuSub}</div>
      <div class="rate-legend">
        <span class="li"><span class="ic st-must">${STATE_SYMBOL[1]}</span>${t.rateMust}</span>
        <span class="li"><span class="ic st-like">${STATE_SYMBOL[2]}</span>${t.rateLike}</span>
        <span class="li"><span class="ic st-maybe">${STATE_SYMBOL[3]}</span>${t.rateMaybe}</span>
        <span class="li"><span class="ic st-off">${STATE_SYMBOL[4]}</span>${t.rateOff}</span>
      </div>
      ${CAT_ORDER.map(c=>categoryBlock(c)).join("")}
    </div>
    ` : ""}

    ${isAnnual ? `
    <div class="section">
      <div class="section-head"><span class="num">${nextNum()}</span><h2>${t.annualPastHead}</h2></div>
      <div class="section-sub">${t.annualPastSub}</div>
      ${qa("pastQ1", t.pastQ1)}
      ${achievementsBlock()}
      ${qa("pastQ2", t.pastQ2)}
      ${qa("pastQ3", t.pastQ3)}
      ${gratitudeBlock()}
      ${qa("pastQ4", t.pastQ4)}
      <div class="qa"><label>${t.pastWordsHead}</label>
        <div class="triplet">
          ${tripletInput("pastWord1", "1")}
          ${tripletInput("pastWord2", "2")}
          ${tripletInput("pastWord3", "3")}
        </div>
      </div>
      ${growthBlock()}
      ${boundariesBlock()}
    </div>

    <div class="section">
      <div class="section-head"><span class="num">${nextNum()}</span><h2>${t.annualFutureHead}</h2></div>
      <div class="section-sub">${t.annualFutureSub}</div>
      ${qa("futureQ1", t.futureQ1)}
      ${qa("futureQ2", t.futureQ2)}
      ${qa("futureQ3", t.futureQ3)}
      <div class="qa"><label>${t.futureTripletHead}</label>
        <div class="triplet">
          ${tripletInput("futureT1", t.futureT1)}
          ${tripletInput("futureT2", t.futureT2)}
          ${tripletInput("futureT3", t.futureT3)}
        </div>
      </div>
      ${qa("wordYear", t.wordYearHead, false)}
      ${lifeGoalsBlock()}
      ${roadmapBlock()}
      ${bucketBlock()}
    </div>
    ` : isWeekly ? `
    <div class="section">
      <div class="section-head"><span class="num">${nextNum()}</span><h2>${t.weeklyTitle}</h2></div>
      <div class="section-sub">${t.weeklySub}</div>
      ${weeklyBlock()}
    </div>
    ` : `
    <div class="section">
      <div class="section-head"><span class="num">${nextNum()}</span><h2>${t.quarterlyQHead}</h2></div>
      ${qa("q1", t.q1)}
      ${qa("q2", t.q2)}
      ${qa("q3", t.q3)}
    </div>
    `}

    <div class="actions">
      <button class="btn primary" onclick="saveEntry()">${t.saveBtn}</button>
      <button class="btn ghost" onclick="window.print()">${t.printBtn}</button>
      <span class="save-msg" id="saveMsg">${t.saved}</span>
    </div>

    <div class="section history-section" style="margin-top:36px;">
      <div class="section-head"><h2>${t.historyHead}</h2></div>
      <div class="section-sub">${t.historySub}</div>
      ${history}
    </div>

    <footer>${t.footer}</footer>
  `;
}

/* ---------------------------------------------------------------
   Handlers (exposed globally)
--------------------------------------------------------------- */
function setLang(l){ state.lang = l; render(); }
function setMode(m){ state.mode = m; render(); }
function updateDate(v){ state.date = v; }
function updateNote(cat, v){ state.notes[cat] = v; }
function updateAnswer(key, v){ state.answers[key] = v; }
function cycleItem(cat, key){
  const cur = state.checked[cat][key] || 0;
  state.checked[cat][key] = (cur + 1) % 5;
  render();
}
function updateAchieveField(idx, field, val){ state.achievementRows[idx][field] = val; }
function addAchieveRow(){ state.achievementRows.push({moment:"",emotions:"",why:"",keep:""}); render(); }
function removeAchieveRow(idx){ state.achievementRows.splice(idx,1); if(state.achievementRows.length===0){ state.achievementRows=[{moment:"",emotions:"",why:"",keep:""}]; } render(); }
function updateGrowthField(idx, field, val){ state.growthRows[idx][field] = val; }
function addGrowthRow(){ state.growthRows.push({issue:"",causes:"",help:"",next:""}); render(); }
function removeGrowthRow(idx){ state.growthRows.splice(idx,1); if(state.growthRows.length===0){ state.growthRows=[{issue:"",causes:"",help:"",next:""}]; } render(); }
function updateLifeGoal(area, field, val){ if(!state.lifeGoals[area]) state.lifeGoals[area]={goal:"",support:""}; state.lifeGoals[area][field] = val; }
function updateBucket(val){ state.bucket = val; }
function addCustom(cat){
  const input = document.getElementById("add-"+cat);
  const val = input.value.trim();
  if(!val) return;
  state.customComponents[cat].push(val);
  render();
}
function openHistory(id){
  const entry = state.history.find(e=>e.id===id);
  if(entry) loadEntryIntoForm(entry);
}
function deleteEntryUI(id){ deleteEntry(id); }

window.saveEntry = saveEntry;
window.setLang = setLang;
window.setMode = setMode;
window.updateDate = updateDate;
window.updateNote = updateNote;
window.updateAnswer = updateAnswer;
window.cycleItem = cycleItem;
window.updateGrowthField = updateGrowthField;
window.addGrowthRow = addGrowthRow;
window.removeGrowthRow = removeGrowthRow;
window.updateAchieveField = updateAchieveField;
window.addAchieveRow = addAchieveRow;
window.removeAchieveRow = removeAchieveRow;
window.updateLifeGoal = updateLifeGoal;
window.updateBucket = updateBucket;
window.addCustom = addCustom;
window.openHistory = openHistory;
window.deleteEntryUI = deleteEntryUI;

/* ---------------------------------------------------------------
   Init
--------------------------------------------------------------- */
(async function init(){
  render();
  await loadHistory();
  render();
})();
</script>
